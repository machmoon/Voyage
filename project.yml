name: Voyage
options:
  bundleIdPrefix: com.patrickliu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# `Voyage/PrivacyInfo.xcprivacy` is picked up by the Voyage target's directory
# source, but XcodeGen has no built-in phase for the extension, so declare it.
# Resources flatten to the bundle root, which is where Apple looks for it.
# VoyageWidgets carries its own since the Home Screen widget reads the App
# Group's UserDefaults suite (reason 1C8F.1, App Group defaults).
fileTypes:
  xcprivacy:
    buildPhase: resources
# RevenueCat for the optional First Class membership. Pinned exactly, like the
# runner image in ci.yml, so an SDK bump is a deliberate commit. The
# `purchases-ios-spm` mirror is the package URL RevenueCat's installation docs
# give for SPM (same tags as RevenueCat/purchases-ios, without the repo's test
# fixtures, so resolution is faster).
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    exactVersion: 5.91.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7"
    # App Store Connect: 1.3 (9) is live. 1.4 ships as build 10.
    # Increment this shared app/widget build number for each upload.
    CURRENT_PROJECT_VERSION: "16"
    GENERATE_INFOPLIST_FILE: false
  # Airplane Mode (Screen Time app blocking, `Voyage/ScreenTime/`). One switch,
  # read by the app's entitlements file, its compilation condition, its
  # Info.plist (`VoyageScreenTime`), the extension embed script and the two
  # extensions' signing. Debug carries the Family Controls entitlement, which
  # every developer team may use for development. Release does not: App Store
  # distribution needs Apple's Family Controls distribution approval, which
  # has not been granted, so Release signs and archives exactly as before
  # (no entitlement, no FamilyControls import, no extensions embedded).
  #
  # Once Apple approves all three bundle ids (com.patrickliu.voyage,
  # com.patrickliu.voyage.deviceactivity, com.patrickliu.voyage.shieldconfig):
  #   1. set `VOYAGE_SCREEN_TIME: YES` under `configs: Release` below,
  #   2. create App Store profiles "Voyage Device Activity" and "Voyage Shield
  #      Configuration" (Family Controls + the App Group) and regenerate the
  #      "Voyage" profile with Family Controls added,
  #   3. `xcodegen generate`, archive, and run scripts/check_release.py.
  configs:
    Debug:
      VOYAGE_SCREEN_TIME: "YES"
    Release:
      VOYAGE_SCREEN_TIME: "NO"
targets:
  Voyage:
    type: application
    platform: iOS
    sources:
      - path: Voyage
    # Entitlements: the App Group is shared with VoyageWidgets so the Home
    # Screen widget can read the snapshot the app writes
    # (Voyage/Shared/WidgetSnapshot.swift). The group must also be registered
    # on the developer account and added to both App Store provisioning
    # profiles ("Voyage", "Voyage Widgets") before Release.
    #
    # The file is chosen by VOYAGE_SCREEN_TIME (CODE_SIGN_ENTITLEMENTS below),
    # so the app no longer uses XcodeGen's `entitlements:` key, which would
    # pin one file for every configuration. Both files are kept by hand:
    # Voyage/Support/Voyage.entitlements (App Group only, Release) and
    # Voyage/Support/Voyage.ScreenTime.entitlements (plus Family Controls).
    postBuildScripts:
      # The two Screen Time extensions are embedded only when
      # VOYAGE_SCREEN_TIME is YES, so a Release archive carries no extension
      # it has no provisioning profile for. XcodeGen has no per-configuration
      # embed, so the dependencies below are build-only (`embed: false`) and
      # this phase copies the already-signed .appex bundles into PlugIns. It
      # runs before the app's own CodeSign step, like Xcode's embed phase.
      - name: Embed Screen Time extensions
        basedOnDependencyAnalysis: false
        script: |
          dest="$TARGET_BUILD_DIR/$PLUGINS_FOLDER_PATH"
          for ext in VoyageDeviceActivity VoyageShieldConfiguration; do
            if [ "$VOYAGE_SCREEN_TIME" = "YES" ] && [ -d "$BUILT_PRODUCTS_DIR/$ext.appex" ]; then
              mkdir -p "$dest"
              rsync -a --delete "$BUILT_PRODUCTS_DIR/$ext.appex/" "$dest/$ext.appex/"
            else
              rm -rf "$dest/$ext.appex"
            fi
          done
    preBuildScripts:
      # Ada's rule (app/vite.config.ts `refuseTestStoreKey`), applied at the
      # one point every Release build passes through: a Test Store key
      # simulates every purchase, so a store build carrying one would sell
      # nothing and unlock everything. VOYAGE_ALLOW_TEST_STORE=1 lets a demo
      # build through on purpose, by name.
      - name: Refuse Test Store key in Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            case "$REVENUECAT_API_KEY" in
              test_*)
                if [ "$VOYAGE_ALLOW_TEST_STORE" != "1" ]; then
                  echo "error: Refusing to build Release with a RevenueCat Test Store key; set VOYAGE_ALLOW_TEST_STORE=1 for a demo build."
                  exit 1
                fi ;;
            esac
          fi
    dependencies:
      - target: VoyageWidgets
        embed: true
      # Built always, embedded by the script above only when Screen Time is on.
      - target: VoyageDeviceActivity
        embed: false
      - target: VoyageShieldConfiguration
        embed: false
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickliu.voyage
        # Public RevenueCat SDK key, read by Membership through Info.plist
        # (RevenueCatAPIKey). Per configuration, below: Debug carries the
        # project's Test Store key (`test_…`, simulated purchases, public by
        # design); Release carries the placeholder until real App Store
        # products exist, then the `appl_…` key. Any value without one of
        # those prefixes leaves the SDK unconfigured and hides Voyage First.
        REVENUECAT_API_KEY: REVENUECAT_API_KEY_NOT_SET
        DEVELOPMENT_TEAM: "3QQL2XA4VS"
        INFOPLIST_FILE: Voyage/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: true
        # Airplane Mode: `#if VOYAGE_SCREEN_TIME_YES` guards every file that
        # imports FamilyControls, ManagedSettings or DeviceActivity, so a
        # Release binary does not even link them. The entitlements file is
        # picked by the same switch; Voyage.entitlements (XcodeGen-generated,
        # above) stays the Release file, without Family Controls.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VOYAGE_SCREEN_TIME_$(VOYAGE_SCREEN_TIME)"
        VOYAGE_ENTITLEMENTS_NO: Voyage/Support/Voyage.entitlements
        VOYAGE_ENTITLEMENTS_YES: Voyage/Support/Voyage.ScreenTime.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(VOYAGE_ENTITLEMENTS_$(VOYAGE_SCREEN_TIME))"
      configs:
        # RevenueCat Test Store key for Debug (simulator, CI, the Shipaton
        # demo). RevenueCat: "Never submit an app to the App Store configured
        # with a Test Store API key", so Release never gets it: the
        # `Refuse Test Store key in Release` pre-build script below fails any
        # Release build whose key starts with `test_`, and
        # scripts/check_release.py re-checks the built Info.plist.
        Debug:
          REVENUECAT_API_KEY: test_LlloIJeXyDjIqWpcwNZexxJvRHW
        # Release signs manually against the App Store distribution profile.
        # Automatic signing cannot be used for the archive: it provisions with
        # a *development* profile, and Apple will not issue one to a team with
        # no registered devices. Debug stays automatic so simulator builds and
        # tests are unaffected.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Voyage"
  VoyageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VoyageWidgets
      - path: Voyage/Shared
    entitlements:
      path: VoyageWidgets/VoyageWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.patrickliu.voyage
    info:
      path: VoyageWidgets/Info.plist
      properties:
        CFBundleDisplayName: Voyage Flight
        # XcodeGen regenerates this Info.plist on every `xcodegen generate` and
        # its defaults are the literals "1.0" / "1", so editing the plist by
        # hand is useless. Without these two lines the widget keeps
        # CFBundleVersion 1 while the app moves on, and the upload fails
        # validation on the app/extension version mismatch.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickliu.voyage.widgets
        DEVELOPMENT_TEAM: "3QQL2XA4VS"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Voyage Widgets"
  # Airplane Mode's safety net: a DeviceActivityMonitor scheduled to end at
  # the flight's scheduled end plus a margin, which lowers the shields if the
  # app was killed mid-flight. This is how Foqos does it
  # (awaseem/foqos FoqosDeviceMonitor/, 4f6864c): its own target, the
  # Family Controls entitlement and the App Group, NSExtensionPrincipalClass
  # in Info.plist.
  VoyageDeviceActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: VoyageDeviceActivity
      - path: Voyage/Shared/AirplaneModeFlight.swift
      - path: Voyage/Shared/WidgetSnapshot.swift
      - path: Voyage/ScreenTime/AppBlockerUtil.swift
      - path: Voyage/ScreenTime/DeviceActivityCenterUtil.swift
    entitlements:
      path: VoyageDeviceActivity/VoyageDeviceActivity.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.patrickliu.voyage
    info:
      path: VoyageDeviceActivity/Info.plist
      properties:
        CFBundleDisplayName: Voyage Airplane Mode
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickliu.voyage.deviceactivity
        DEVELOPMENT_TEAM: "3QQL2XA4VS"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
        # The extension exists only for Screen Time, so its code always
        # compiles; whether it is signed (and embedded) follows the switch.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VOYAGE_SCREEN_TIME_YES"
        CODE_SIGNING_ALLOWED: "$(VOYAGE_SCREEN_TIME)"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Voyage Device Activity"
  # The shield a blocked app shows during a flight: "You're in flight", the
  # destination and the minutes to landing, read from the App Group. Foqos's
  # FoqosShieldConfig (4f6864c) is the shape: ShieldConfigurationDataSource as
  # NSExtensionPrincipalClass, and the App Group as its only entitlement.
  VoyageShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: VoyageShieldConfiguration
      - path: Voyage/Shared/AirplaneModeFlight.swift
      - path: Voyage/Shared/WidgetSnapshot.swift
    entitlements:
      path: VoyageShieldConfiguration/VoyageShieldConfiguration.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.patrickliu.voyage
    info:
      path: VoyageShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Voyage Shield
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShieldConfigurationExtension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickliu.voyage.shieldconfig
        DEVELOPMENT_TEAM: "3QQL2XA4VS"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: "$(VOYAGE_SCREEN_TIME)"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Voyage Shield Configuration"
  VoyageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoyageTests
    dependencies:
      - target: Voyage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickliu.voyage.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # Renders every widget and Live Activity presentation to PNG (set
  # VOYAGE_WIDGET_SNAPSHOT_DIR) and checks the entry logic. Hostless: it
  # compiles the widget's view files directly, because an app extension
  # cannot host tests and the app target cannot see the extension's views.
  VoyageWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoyageWidgetsTests
      - path: Voyage/Shared
      - path: VoyageWidgets/WidgetTheme.swift
      - path: VoyageWidgets/FlightActivityViews.swift
      - path: VoyageWidgets/NextFlightWidgetView.swift
      - path: VoyageWidgets/NextFlightWidget.swift
      - path: VoyageWidgets/Styles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickliu.voyage.widgettests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  VoyageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VoyageUITests
    dependencies:
      - target: Voyage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickliu.voyage.uitests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  Voyage:
    build:
      targets:
        Voyage: all
        VoyageTests: [test]
        VoyageWidgetsTests: [test]
        VoyageUITests: [test]
    test:
      targets:
        - VoyageTests
        - VoyageWidgetsTests
        - VoyageUITests
      gatherCoverageData: false
