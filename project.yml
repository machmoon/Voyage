name: Voyage
options:
  bundleIdPrefix: com.patliu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # Bumped for the App Review resubmission: build 1 was rejected 2026-08-05
    # (guidelines 2.5.4 / 5.2.5). App Store Connect refuses a re-upload that
    # reuses a build number, so this must increase for every upload.
    # `scripts/ship.sh --bump` increments it here — the single source of truth
    # for BOTH the app and the widget extension.
    CURRENT_PROJECT_VERSION: "2"
    GENERATE_INFOPLIST_FILE: false
targets:
  Voyage:
    type: application
    platform: iOS
    sources:
      - path: Voyage
    dependencies:
      - target: VoyageWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patliu.voyage
        INFOPLIST_FILE: Voyage/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: true
  VoyageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VoyageWidgets
      - path: Voyage/Shared
    info:
      path: VoyageWidgets/Info.plist
      properties:
        CFBundleDisplayName: Voyage Flight
        # XcodeGen regenerates this Info.plist on every `xcodegen generate`
        # and its defaults are the literals "1.0" / "1". Without these two
        # lines the widget keeps CFBundleVersion 1 while the app moves on,
        # and the upload fails validation on the app/extension mismatch.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patliu.voyage.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
  VoyageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoyageTests
    dependencies:
      - target: Voyage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patliu.voyage.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  VoyageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VoyageUITests
    dependencies:
      - target: Voyage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patliu.voyage.uitests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  Voyage:
    build:
      targets:
        Voyage: all
        VoyageTests: [test]
        VoyageUITests: [test]
    test:
      targets:
        - VoyageTests
        - VoyageUITests
      gatherCoverageData: false
