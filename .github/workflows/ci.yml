# Voyage CI.
#
# Structure follows two open-source iOS apps that, like Voyage, generate their
# Xcode project from a `project.yml` with XcodeGen rather than committing a
# hand-maintained one:
#
#   premnirmal/StockTicker  .github/workflows/ios.yml
#   DimensionDev/Flare      .github/workflows/ios.yml
#
# Both do the same four things in the same order: pin the runner image, select
# Xcode with maxim-lobanov/setup-xcode, download the iOS platform on demand,
# then `brew install xcodegen` and `xcodegen generate` before any xcodebuild.
# The `xcrun simctl list devices available` diagnostic step is from
# pointfreeco/swift-composable-architecture .github/workflows/ci.yml, where it
# exists so a destination failure on a runner is debuggable from the log.
#
# Deliberately NOT copied:
#   - `-skipMacroValidation` / `-skipPackagePluginValidation`. Flare and
#     isowords pass these because they have SPM dependencies and macros. Voyage
#     has neither, so they would be cargo cult.
#   - DerivedData caching. swift-composable-architecture caches `~/.derivedData`,
#     but only works because it also sets `IgnoreFileSystemDeviceInodeChanges`
#     and runs `chetan/git-restore-mtime-action`. Voyage's build is small; add
#     the cache and both companion steps together or not at all.

name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit test
    # Pinned, never `macos-latest`. The runner image is what actually fixes the
    # SDK, and an image bump moving the simulator out from under the destination
    # below should be a deliberate commit, not a surprise on a Tuesday.
    # StockTicker pins for the same stated reason.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Flare uses `latest-stable`; StockTicker pins an exact version.
          # Voyage has no third-party binary artifacts tying it to one Xcode, so
          # the runner pin above carries the reproducibility and this can float.
          # Change to an exact version (for example '26.0') the first time a
          # point release breaks the build.
          xcode-version: latest-stable

      - name: Install iOS platform
        # The macos-26 image ships the iOS SDK but not the simulator runtime, so
        # a named destination fails with "iOS 26.0 is not installed" until this
        # runs. StockTicker documents the same failure.
        # The download talks to CoreSimulator and sometimes fails with
        # "Unable to connect to simulator" (exit 70) right after the runner
        # boots, so retry, and skip when a runtime is already installed.
        run: |
          if xcrun simctl list runtimes | grep -q "iOS "; then
            echo "iOS simulator runtime already installed"; exit 0
          fi
          for attempt in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS && exit 0
            echo "downloadPlatform failed (attempt $attempt); retrying in 30s"
            sleep 30
          done
          exit 70

      - name: Install Metal toolchain
        # Voyage/Support/Shaders.metal holds the window's atmospheric haze
        # colorEffect. Without the toolchain the Metal compile step fails on a
        # clean runner. See CLAUDE.md.
        run: sudo xcodebuild -downloadComponent MetalToolchain

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        # Voyage.xcodeproj is generated from project.yml. Regenerating here is
        # what proves the spec is the source of truth, and it is how the new
        # Voyage/PrivacyInfo.xcprivacy reaches the app bundle.
        run: xcodegen generate

      - name: Validate release configuration
        run: |
          python3 scripts/check_release.py
          python3 scripts/test_check_release.py

      - name: List available simulators
        # Diagnostic only. When the destination below stops resolving, this is
        # the step that says why.
        run: xcrun simctl list devices available

      - name: Build
        run: |
          xcodebuild build \
            -project Voyage.xcodeproj \
            -scheme Voyage \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        # VoyageTests only. The UI tours drive real animations and a 60s demo
        # flight, and they are timing-sensitive under a loaded runner, so they
        # stay a local gate until they have been run green on a quiet machine.
        # Neither StockTicker, Flare, isowords nor swift-composable-architecture
        # runs UI tests in CI either.
        run: |
          xcodebuild test \
            -project Voyage.xcodeproj \
            -scheme Voyage \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:VoyageTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore

  demo:
    name: Shipaton demo video (Test Store purchase)
    # The video beat from docs/shipaton/SPEC.md, recorded on a CI simulator:
    # locked First seat -> upgrade offer -> RevenueCat paywall -> Test Store
    # purchase -> seat unlocks -> Settings Active. Debug carries the public
    # Test Store key (project.yml), so this talks to RevenueCat's servers but
    # no money moves. Build first, then record only the test run, so the
    # video is the demo and not twenty minutes of compiling.
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install iOS platform
        run: |
          if xcrun simctl list runtimes | grep -q "iOS "; then exit 0; fi
          for attempt in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS && exit 0
            sleep 30
          done
          exit 70
      - name: Install Metal toolchain
        run: sudo xcodebuild -downloadComponent MetalToolchain
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name']=='iPhone 17'))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Voyage.xcodeproj -scheme Voyage \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO
      - name: Install the app and grant location
        # Granting needs the app installed first, or the grant is dropped and
        # the location prompt lands on the recording.
        run: |
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/Voyage.app
          xcrun simctl privacy "$UDID" grant location com.patrickliu.voyage || true
          xcrun simctl privacy "$UDID" grant location-always com.patrickliu.voyage || true
      - name: Run the demo and record the screen
        run: |
          mkdir -p shipaton-media
          python3 -c 'import time; print("%.3f" % time.time())' > shipaton-media/record-start.txt
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force shipaton-media/shipaton-demo-raw.mp4 &
          REC=$!
          sleep 2
          set +e
          TEST_RUNNER_SHIPATON_CAPTURE_DIR="$PWD/shipaton-media" xcodebuild test-without-building \
            -project Voyage.xcodeproj -scheme Voyage \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            -only-testing:VoyageUITests/ShipatonDemoUITests \
            -resultBundlePath shipaton-media/ShipatonDemo.xcresult
          STATUS=$?
          sleep 1
          kill -INT $REC
          wait $REC
          # Trim to the demo: from just before launch to just after the
          # last screenshot, using the marks the test wrote (avconvert ships
          # with macOS and takes --start/--duration).
          if [ -f shipaton-media/demo-start.txt ] && [ -f shipaton-media/demo-end.txt ]; then
            read START DURATION < <(python3 -c "
          r=float(open('shipaton-media/record-start.txt').read()); a=float(open('shipaton-media/demo-start.txt').read()); b=float(open('shipaton-media/demo-end.txt').read())
          s=max(0.0, a-r-0.5); print('%.2f %.2f' % (s, b-a+1.5))")
            avconvert --source shipaton-media/shipaton-demo-raw.mp4 --preset PresetPassthrough \
              --output shipaton-media/shipaton-demo.mp4 --start "$START" --duration "$DURATION" --replace \
              || cp shipaton-media/shipaton-demo-raw.mp4 shipaton-media/shipaton-demo.mp4
          else
            cp shipaton-media/shipaton-demo-raw.mp4 shipaton-media/shipaton-demo.mp4
          fi
          ls -la shipaton-media
          exit $STATUS
      - name: Record the flight beat
        # A second recording for the video's flight: miles card, if-then plan,
        # bag tags, the torn pass, a demo-length leg, baggage claim, customs and
        # the Flight Manual. Reinstalled first so it flies as a free traveler,
        # not the Voyage First member the purchase above just made.
        if: always()
        run: |
          mkdir -p shipaton-flight
          xcrun simctl uninstall "$UDID" com.patrickliu.voyage || true
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/Voyage.app
          xcrun simctl privacy "$UDID" grant location com.patrickliu.voyage || true
          xcrun simctl privacy "$UDID" grant location-always com.patrickliu.voyage || true
          python3 -c 'import time; print("%.3f" % time.time())' > shipaton-flight/record-start.txt
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force shipaton-flight/flight-raw.mp4 &
          REC=$!
          sleep 2
          set +e
          TEST_RUNNER_SHIPATON_CAPTURE_DIR="$PWD/shipaton-flight" xcodebuild test-without-building \
            -project Voyage.xcodeproj -scheme Voyage \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            -only-testing:VoyageUITests/ShipatonFlightUITests \
            -resultBundlePath shipaton-flight/ShipatonFlight.xcresult
          STATUS=$?
          sleep 1
          kill -INT $REC
          wait $REC
          if [ -f shipaton-flight/flight-start.txt ] && [ -f shipaton-flight/flight-end.txt ]; then
            read START DURATION < <(python3 -c "
          r=float(open('shipaton-flight/record-start.txt').read()); a=float(open('shipaton-flight/flight-start.txt').read()); b=float(open('shipaton-flight/flight-end.txt').read())
          s=max(0.0, a-r-0.5); print('%.2f %.2f' % (s, b-a+1.5))")
            avconvert --source shipaton-flight/flight-raw.mp4 --preset PresetPassthrough \
              --output shipaton-flight/flight.mp4 --start "$START" --duration "$DURATION" --replace \
              || cp shipaton-flight/flight-raw.mp4 shipaton-flight/flight.mp4
          else
            cp shipaton-flight/flight-raw.mp4 shipaton-flight/flight.mp4
          fi
          rm -f shipaton-flight/flight-raw.mp4
          ls -la shipaton-flight
          exit 0
      - name: Upload the flight beat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipaton-flight
          path: |
            shipaton-flight/*.mp4
            shipaton-flight/*.png
          if-no-files-found: warn
      - name: Compact copies for the repo
        # A phone-sized mp4 (avconvert ships with macOS) and JPEG stills, small
        # enough to commit under docs/shipaton/media; the full-resolution
        # originals stay in the shipaton-demo artifact.
        if: always()
        run: |
          mkdir -p shipaton-compact
          if [ -f shipaton-media/shipaton-demo.mp4 ]; then
            avconvert --source shipaton-media/shipaton-demo.mp4 --preset Preset960x540 \
              --output shipaton-compact/shipaton-demo-540p.mp4 --replace || true
          fi
          for f in shipaton-media/*.png; do
            [ -f "$f" ] || continue
            sips -Z 1280 -s format jpeg -s formatOptions 72 "$f" \
              --out "shipaton-compact/$(basename "${f%.png}").jpg" >/dev/null
          done
          ls -la shipaton-compact
      - name: Upload compact media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipaton-demo-compact
          path: shipaton-compact
          if-no-files-found: warn
      - name: Upload video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipaton-demo
          path: |
            shipaton-media/*.mp4
            shipaton-media/*.png
          if-no-files-found: warn
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipaton-demo-xcresult
          path: shipaton-media/ShipatonDemo.xcresult
          if-no-files-found: ignore
